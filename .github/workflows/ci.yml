name: CI and Release

on:
  push:
    branches: [main, 'v*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/WindowsPrivacyPlatform.sln

      - name: Build (Release)
        run: dotnet build Source/WindowsPrivacyPlatform.sln -c Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: dotnet test Source/WindowsPrivacyPlatform.sln -c Release --no-build --verbosity normal

  package:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # All signing values are optional. Store them as repository secrets.
      WPP_SIGN_CERT_BASE64: ${{ secrets.WPP_SIGN_CERT_BASE64 }}
      WPP_SIGN_CERT_PATH: ${{ secrets.WPP_SIGN_CERT_PATH }}
      WPP_SIGN_CERT_THUMBPRINT: ${{ secrets.WPP_SIGN_CERT_THUMBPRINT }}
      WPP_SIGN_CERT_PASSWORD: ${{ secrets.WPP_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/WindowsPrivacyPlatform.sln

      - name: Prepare optional signing certificate
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WPP_SIGN_CERT_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'wpp-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WPP_SIGN_CERT_BASE64))
            "WPP_SIGN_CERT_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Publish, optionally sign, and package
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Re-audit release archive
        shell: pwsh
        run: ./scripts/verify-release.ps1 -ArchivePath .artifacts/release/WindowsPrivacyPlatform-win-x64.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: WindowsPrivacyPlatform-win-x64
          path: |
            .artifacts/release/WindowsPrivacyPlatform-win-x64.zip
            .artifacts/release/WindowsPrivacyPlatform-win-x64.zip.sha256
          if-no-files-found: error

      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            '.artifacts/release/WindowsPrivacyPlatform-win-x64.zip',
            '.artifacts/release/WindowsPrivacyPlatform-win-x64.zip.sha256'
          )
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Windows Privacy Platform $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
