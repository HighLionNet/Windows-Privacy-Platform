name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/WindowsPrivacyPlatform.sln

      - name: Build (Release)
        run: dotnet build Source/WindowsPrivacyPlatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test Source/WindowsPrivacyPlatform.sln -c Release --no-build --verbosity normal
