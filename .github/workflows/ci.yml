name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/WindowsPrivacyPlatform.sln

      - name: Build (Release)
        run: dotnet build Source/WindowsPrivacyPlatform.sln -c Release --no-restore

      - name: Catalog load sanity
        run: |
          dotnet run --project Source/WindowsPrivacyPlatform.App/WindowsPrivacyPlatform.App.csproj -c Release --no-build -- --help 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
        shell: pwsh
        continue-on-error: true
